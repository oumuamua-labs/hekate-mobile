[package]
name = "mobile-determinism-harness"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "determinism-harness"
path = "src/main.rs"

[dependencies]
hekate-prover-sys = { version = "=0.37.0", features = ["ct"] }
hekate-core = "=0.37.0"
hekate-program = "=0.37.0"
hekate-math = "=0.12.0"
hekate-sdk = "=0.37.0"
hekate-verifier = "=0.37.0"
hekate-crypto = "=0.37.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1